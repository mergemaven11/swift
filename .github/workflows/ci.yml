name: Local CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiftfilez-local-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-tests:
    name: SwiftFilez tests (self-hosted)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, swiftfilez]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner environment
        run: |
          python3 --version
          git --version
          uname -a

      - name: Create virtual environment
        run: |
          rm -rf .venv-ci
          python3 -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile
        run: |
          . .venv-ci/bin/activate
          python -m compileall -q swift_files main.py

      - name: Lint
        run: |
          . .venv-ci/bin/activate
          python -m ruff format --check swift_files tests main.py
          python -m ruff check swift_files tests main.py

      - name: Test YARA malware scanning
        run: |
          . .venv-ci/bin/activate
          python -m pytest tests/test_malware.py -v

      - name: Full pytest suite
        run: |
          . .venv-ci/bin/activate
          python -m pytest

      - name: CLI smoke
        run: |
          . .venv-ci/bin/activate
          swf --version
          swf doctor --json
