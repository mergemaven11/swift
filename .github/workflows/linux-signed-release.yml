name: Linux Signed Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install, test, and build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' pyinstaller
          python -m pytest
          pyinstaller --clean --noconfirm --onefile --name swf main.py
          pyinstaller --clean --noconfirm --onefile --name SwiftFilez --collect-all textual packaging/desktop_launcher.py
          ./dist/swf --version
          mkdir -p package
          cp dist/swf dist/SwiftFilez package/
          cp README.md LICENSE package/
          tar -C package -czf SwiftFilez-Linux-x86_64.tar.gz .
          sha256sum SwiftFilez-Linux-x86_64.tar.gz > SwiftFilez-Linux-x86_64.tar.gz.sha256

      - name: Generate signed build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: SwiftFilez-Linux-x86_64.tar.gz

      - name: Publish rolling Linux package
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view linux-latest >/dev/null 2>&1 &&             gh release upload linux-latest SwiftFilez-Linux-x86_64.tar.gz SwiftFilez-Linux-x86_64.tar.gz.sha256 --clobber ||             gh release create linux-latest SwiftFilez-Linux-x86_64.tar.gz SwiftFilez-Linux-x86_64.tar.gz.sha256 --target main --title "SwiftFilez Linux" --notes "Linux binary bundle with GitHub signed build provenance." --prerelease

      - name: Publish versioned Linux package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 &&             gh release upload "${{ github.ref_name }}" SwiftFilez-Linux-x86_64.tar.gz SwiftFilez-Linux-x86_64.tar.gz.sha256 --clobber ||             gh release create "${{ github.ref_name }}" SwiftFilez-Linux-x86_64.tar.gz SwiftFilez-Linux-x86_64.tar.gz.sha256 --generate-notes --title "SwiftFilez ${{ github.ref_name }}"
