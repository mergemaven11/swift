name: Package SwiftFilez Docs

on:
  push:
    branches:
      - feature/uat-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload docs bundle
        uses: actions/upload-artifact@v4
        with:
          name: swiftfilez-docs-site
          path: docs
          if-no-files-found: error
          retention-days: 1
