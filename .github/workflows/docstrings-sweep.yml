name: Exhaustive Docstring Sweep

on:
  push:
    branches:
      - docs/google-style-docstrings
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/google-style-docstrings
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Insert missing docstrings
        run: python scripts/add_missing_docstrings.py
      - name: Verify exhaustive coverage
        run: python scripts/check_docstrings.py
      - name: Validate syntax
        run: python -m compileall -q .
      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git commit -m "docs: complete exhaustive Python docstring sweep"
          git push origin HEAD:docs/google-style-docstrings
