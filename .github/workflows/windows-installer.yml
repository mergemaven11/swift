name: Windows Installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[malware]" pyinstaller

      - name: Build SwiftFilez executables
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --name swf main.py
          pyinstaller --clean --noconfirm --onefile --name SwiftFilez --collect-all textual packaging/desktop_launcher.py
          .\dist\swf.exe --version

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path swift_files\__init__.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version installer\SwiftFilez.iss
          if (-not (Test-Path "installer\output\SwiftFilez-Setup.exe")) { throw "Installer output was not created." }

      - name: Smoke test silent install and PATH
        shell: pwsh
        run: |
          $installer = (Resolve-Path "installer\output\SwiftFilez-Setup.exe").Path
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\SwiftFilez"
          & $installer /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS="addtopath"
          if ($LASTEXITCODE -ne 0) { throw "Installer exited with code $LASTEXITCODE" }
          & "$installDir\swf.exe" --version
          if (-not (Test-Path "$installDir\SwiftFilez.exe")) { throw "SwiftFilez.exe was not installed." }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if (($userPath -split ';') -notcontains $installDir) { throw "Installer did not add SwiftFilez to the user PATH." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftFilez-Windows-Installer
          path: installer/output/SwiftFilez-Setup.exe
          if-no-files-found: error
