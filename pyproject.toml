[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swiftfilez"
version = "0.4.0"
description = "Production-minded file and artifact operations CLI for humans and automation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Scott", email = "38087336+mergemaven11@users.noreply.github.com"}]
license = "MIT"
keywords = ["cli", "artifacts", "files", "integrity", "platform-engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "textual>=8.2,<9",
  "python-docx>=1.1,<2",
  "pypdf>=4.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "build>=1.2,<2",
]

[project.scripts]
swf = "swift_files.cli:main"
swiftfilez = "swift_files.cli:main"
swf-artifact = "swift_files.formats_cli:main"

[project.urls]
Homepage = "https://github.com/mergemaven11/swift"
Repository = "https://github.com/mergemaven11/swift"
Issues = "https://github.com/mergemaven11/swift/issues"

[tool.setuptools.packages.find]
include = ["swift_files*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]
