<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">SwiftFilez policy gate</title><desc id="desc">Terminal-style product screenshot showing a local artifact policy check passing.</desc><rect width="1200" height="700" rx="28" fill="#07111f"/><rect x="35" y="35" width="1130" height="630" rx="22" fill="#0d1a2a" stroke="#233752" stroke-width="2"/><rect x="35" y="35" width="1130" height="64" rx="22" fill="#112238"/><circle cx="78" cy="67" r="9" fill="#ff7b72"/><circle cx="108" cy="67" r="9" fill="#ffcf70"/><circle cx="138" cy="67" r="9" fill="#53d6c5"/><text x="600" y="74" text-anchor="middle" fill="#9fb0c6" font-family="system-ui,sans-serif" font-size="17">SwiftFilez — Release Policy Gate</text><g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22"><text x="76" y="145" fill="#53d6c5">$</text><text x="105" y="145" fill="#edf5ff">swf policy check release.zip --policy uat-policy.json</text><text x="76" y="205" fill="#7aa8ff">Policy result</text><text x="76" y="252" fill="#9fb0c6">policy</text><text x="260" y="252" fill="#edf5ff">Swift beta release gate</text><text x="76" y="292" fill="#9fb0c6">artifact</text><text x="260" y="292" fill="#edf5ff">release.zip</text><text x="76" y="350" fill="#53d6c5">✓</text><text x="120" y="350" fill="#edf5ff">SBOM required</text><text x="710" y="350" fill="#53d6c5">PASS</text><text x="76" y="398" fill="#53d6c5">✓</text><text x="120" y="398" fill="#edf5ff">Component versions required</text><text x="710" y="398" fill="#53d6c5">PASS</text><text x="76" y="446" fill="#53d6c5">✓</text><text x="120" y="446" fill="#edf5ff">Package URLs required</text><text x="710" y="446" fill="#53d6c5">PASS</text><rect x="76" y="500" width="1020" height="92" rx="14" fill="#0a2a29" stroke="#53d6c5"/><text x="108" y="540" fill="#53d6c5" font-weight="700">ACCEPTED</text><text x="108" y="570" fill="#c4d0de" font-size="18">Release meets the local acceptance policy · exit code 0</text><text x="76" y="628" fill="#9fb0c6" font-size="18">No account · no API key · no SaaS policy engine</text></g></svg>